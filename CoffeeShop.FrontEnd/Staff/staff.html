<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCafe POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/src/js/guard.js"></script>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex flex-col">

    <!-- ========================================== -->
    <!-- HEADER: GỌN GÀNG, SẠCH SẼ                   -->
    <!-- ========================================== -->
    <header class="bg-white shadow-sm flex items-center justify-between px-6 py-4 border-b">
        <div class="flex items-center gap-3">
            <!-- Icon Logo -->
            <div class="bg-amber-500 text-white p-2 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">Quán Cà Phê</h1>
                <p class="text-sm text-gray-500">Nhân Viên</p>
            </div>
        </div>
        
        <!-- Đưa nút Logout lên góc phải -->
        <button id="btnLogout" class="flex items-center gap-2 text-red-600 hover:text-red-800 font-semibold transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Đăng Xuất
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT: CHIA 2 CỘT (MENU & CART)      -->
    <!-- ========================================== -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- CỘT TRÁI: DANH SÁCH SẢN PHẨM (Khu vực order) -->
        <div class="w-2/3 p-6 overflow-y-auto">
            <!-- Filter Tabs -->
            <div class="flex gap-2 mb-6">
                <button class="px-4 py-2 bg-amber-500 text-white font-semibold rounded-lg shadow">Tất Cả</button>
                <button id="btnOpenImportModal" class="px-4 py-2 bg-white border text-gray-600 rounded-lg shadow-sm hover:bg-gray-50">Nhập Kho</button>
                <button id="btnOpenPendingOrders" class="px-4 py-2 bg-white border text-blue-600 font-semibold rounded-lg shadow-sm hover:bg-blue-50">Đơn Đang Chờ</button>
            </div>
            
            <!-- Danh sách món (Ví dụ) -->
            <div id="product-container" class="grid grid-cols-3 gap-4">
                
            </div>
        </div>

        <!-- CỘT PHẢI: HÓA ĐƠN (Current Order) -->
        <div class="w-1/3 bg-white border-l flex flex-col">
            <div class="p-6 border-b flex-1 flex flex-col overflow-hidden">
                <h2 class="text-xl font-bold text-gray-800 mb-1">Đơn Hiện Tại</h2>
                <p id="cart-count" class="text-sm text-gray-500 mb-4">0 món</p>
                
                <div id="cart-items" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <div class="flex flex-col items-center justify-center h-full text-gray-400">
                        <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <p>Giỏ hàng đang trống</p>
                    </div>
                </div>
            </div>
        
            <div class="p-6 bg-gray-50 border-t">
                <div class="flex justify-between mb-2 text-gray-600">
                    <span>Tạm tính</span>
                    <span id="subtotal" class="font-bold">0đ</span>
                </div>
                <div class="flex justify-between mb-4 text-gray-600">
                    <span>Tax (8%)</span>
                    <span id="tax" class="font-bold">0đ</span>
                </div>
                <div class="flex justify-between mb-6 text-xl">
                    <span class="font-bold text-gray-800">Tổng tiền</span>
                    <span id="total" class="font-bold text-amber-600 text-2xl">0đ</span>
                </div>
                
                <button id="btnShowQR" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl mb-3 shadow-lg flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    Lưu Đơn Hàng
                </button>
                <button id="btnVoidOrder" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl transition active:scale-95">Xoá Đơn Hàng</button>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- MODAL THANH TOÁN QR (ẨN MẶC ĐỊNH)           -->
    <!-- ========================================== -->
    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-[400px] rounded-2xl p-6 shadow-2xl relative animate-fade-in-up">
            <!-- Nút tắt Modal -->
            <button id="btnCloseQR" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Scan to Pay</h2>
            
            <!-- Khu vực chứa ảnh QR -->
            <div class="border-2 border-dashed border-gray-200 rounded-xl p-4 flex justify-center mb-6">
                <!-- Chỗ này dùng JS để đổi src ảnh thật vào nhé -->
                <div id="qrcodeBox" class="flex justify-center mt-4"></div>
            </div>
            
            <div class="text-center mb-6">
                <p id="qr-total" class="text-4xl font-bold text-gray-800 mb-2">0đ</p>
                <p class="text-sm text-gray-500">Khách hàng sử dụng App Ngân hàng để quét mã</p>
            </div>
            
            <button id="btnConfirmPayment" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                Tạo Đơn (Chờ Khách Quét QR)
            </button>
        </div>
    </div>
    <div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-[400px] rounded-2xl p-6 shadow-2xl relative animate-fade-in-up">
            <!-- Nút tắt Modal -->
            <button id="btnCloseImport" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Nhập Nguyên Vật Liệu</h2>
            
            <!-- Form Nhập Kho -->
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chọn nguyên vật liệu</label>
                    <select id="importItemId" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- Đệ có thể dùng JS fetch danh sách món từ DB đổ vào đây -->
                        <option value="1">Sữa đặc (ml)</option>
                        <option value="2">Cà phê hạt xay (g)</option>
                        <option value="3">Đường nước (ml)</option>
                        <option value="4">Trân châu trắng (g)</option>
                        <option value="5">Sữa tươi (ml)</option>
                        <option value="6">Trân châu đen (g)</option>
                        <option value="7">Thạch nha đam (g)</option>
                        <option value="8">Kem Macchiato (ml)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số lượng nhập</label>
                    <input type="number" id="importQuantity" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="VD: 1000" min="1">
                </div>
            </div>
            
            <button id="btnSubmitImport" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                Xác nhận lưu kho
            </button>
        </div>
    </div>
    <div id="pendingOrdersModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-[500px] max-h-[80vh] flex flex-col rounded-2xl p-6 shadow-2xl relative animate-fade-in-up">
            <!-- Nút tắt Modal -->
            <button id="btnClosePendingOrders" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Đơn Hàng Đang Chờ</h2>
            
            <!-- Vùng chứa danh sách đơn do JS đổ vào -->
            <div id="pending-orders-container" class="overflow-y-auto flex-1 pr-2 space-y-3">
                <!-- JS sẽ nhét html vào đây -->
            </div>
        </div>
    </div>
     <script src="../src/js/logout.js"></script>
     <script src="/src/js/api.js"></script>
     <script src="/src/js/staff.js"></script>
     <script src="/src/js/images.js"></script>

</body>
</html>
